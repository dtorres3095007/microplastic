version: '3'
services:
  microplastics-backend:
    container_name: microplastics-backend
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - media-data:/app/media
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=microplastic_db
      - DATABASE_USER=micro_user
      - DATABASE_PASSWORD=micropass
      - MEDIA_STORAGE_PATH=/app/media
      - MEDIA_BASE_URL=http://localhost:3000
    depends_on:
      - mysql

  mysql:
    container_name: mysql-container
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: microplastic_db
      MYSQL_USER: micro_user
      MYSQL_PASSWORD: micropass
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
  media-data:
  